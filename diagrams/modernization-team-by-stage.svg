<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" preserveAspectRatio="xMidYMid meet" class="se-svg">
  <text x="750" y="34" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--se-text,#111111);">Team Composition Across the Modernization Engagement</text>
  <text x="750" y="58" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Filled dots show full engagement. Half dots show review-only / cadence engagement. Open dots show on-call. The five stages have distinct involvement profiles.</text>

