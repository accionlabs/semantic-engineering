<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1400" height="860" style="fill:#ffffff"/>

  <text x="700" y="44" text-anchor="middle" style="font:600 28px Segoe UI,system-ui,sans-serif;fill:#111111">Breeze.AI Architecture Overview</text>
  <text x="700" y="72" text-anchor="middle" style="font:17px Segoe UI,system-ui,sans-serif;fill:#4b5563">The four-layer knowledge graph at the center. The agent fleet operates against it. The integration surface plugs it into the client's toolchain.</text>

  <!-- Outer ring: integration surface -->
  <g>
    <circle cx="700" cy="466" r="380" style="fill:none;stroke:#9ca3af;stroke-width:2;stroke-dasharray:4 4"/>
    <!-- Integration domain pill labels around the ring -->
    <!-- top -->
    <g transform="translate(700,86)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">Version Control</text>
    </g>
    <!-- upper-right -->
    <g transform="translate(1018,176)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">CI/CD Pipelines</text>
    </g>
    <!-- right -->
    <g transform="translate(1108,440)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">Ticket Systems</text>
    </g>
    <!-- lower-right -->
    <g transform="translate(1018,720)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">AI Coding Assistants</text>
    </g>
    <!-- bottom -->
    <g transform="translate(700,810)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">Test Runners</text>
    </g>
    <!-- lower-left -->
    <g transform="translate(382,720)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">Observability</text>
    </g>
    <!-- left -->
    <g transform="translate(292,440)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">Design Tools</text>
    </g>
    <!-- upper-left -->
    <g transform="translate(382,176)">
      <rect x="-100" y="0" width="200" height="36" rx="18" ry="18" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:1.5"/>
      <text x="0" y="23" text-anchor="middle" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#111111">Code Repositories</text>
    </g>
  </g>

  <!-- Middle ring: six core agents -->
  <g>
    <circle cx="700" cy="466" r="240" style="fill:none;stroke:#E94E1B;stroke-width:1.5;stroke-dasharray:4 3"/>
    <!-- Six agent boxes evenly spaced on inner ring -->
    <!-- top -->
    <g transform="translate(610,206)">
      <rect x="0" y="0" width="180" height="60" rx="10" ry="10" style="fill:#4b5563"/>
      <text x="90" y="26" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Impact Analysis</text>
      <text x="90" y="46" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Agent</text>
    </g>
    <!-- upper-right -->
    <g transform="translate(820,316)">
      <rect x="0" y="0" width="180" height="60" rx="10" ry="10" style="fill:#4b5563"/>
      <text x="90" y="26" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">PR Validation</text>
      <text x="90" y="46" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Agent</text>
    </g>
    <!-- lower-right -->
    <g transform="translate(820,556)">
      <rect x="0" y="0" width="180" height="60" rx="10" ry="10" style="fill:#4b5563"/>
      <text x="90" y="26" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">KG Sync</text>
      <text x="90" y="46" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Agent</text>
    </g>
    <!-- bottom -->
    <g transform="translate(610,666)">
      <rect x="0" y="0" width="180" height="60" rx="10" ry="10" style="fill:#4b5563"/>
      <text x="90" y="26" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">BDD Generation</text>
      <text x="90" y="46" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Agent</text>
    </g>
    <!-- lower-left -->
    <g transform="translate(400,556)">
      <rect x="0" y="0" width="180" height="60" rx="10" ry="10" style="fill:#4b5563"/>
      <text x="90" y="26" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Coding</text>
      <text x="90" y="46" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Agent</text>
    </g>
    <!-- upper-left -->
    <g transform="translate(400,316)">
      <rect x="0" y="0" width="180" height="60" rx="10" ry="10" style="fill:#4b5563"/>
      <text x="90" y="26" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Test Generation</text>
      <text x="90" y="46" text-anchor="middle" style="font:700 14px Segoe UI,system-ui,sans-serif;fill:#ffffff">Agent</text>
    </g>
  </g>

  <!-- Center: Four-layer KG -->
  <g transform="translate(560,396)">
    <rect x="0" y="0" width="280" height="180" rx="14" ry="14" style="fill:#FDE8DD;stroke:#E94E1B;stroke-width:2.5"/>
    <text x="140" y="30" text-anchor="middle" style="font:700 16px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">FOUR-LAYER KG</text>

    <g transform="translate(20,46)">
      <rect x="0" y="0" width="240" height="26" rx="5" ry="5" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="120" y="18" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#111111">Functional Ontology</text>
    </g>
    <g transform="translate(20,80)">
      <rect x="0" y="0" width="240" height="26" rx="5" ry="5" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="120" y="18" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#111111">Design Ontology</text>
    </g>
    <g transform="translate(20,114)">
      <rect x="0" y="0" width="240" height="26" rx="5" ry="5" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="120" y="18" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#111111">Architecture Ontology</text>
    </g>
    <g transform="translate(20,148)">
      <rect x="0" y="0" width="240" height="26" rx="5" ry="5" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="120" y="18" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#111111">Code Ontology</text>
    </g>
  </g>

  <!-- Labels for the rings -->
  <text x="700" y="58" text-anchor="middle" style="font:italic 11px Segoe UI,system-ui,sans-serif;fill:#9ca3af"></text>
  <g transform="translate(40,118)">
    <text x="0" y="0" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#4b5563;letter-spacing:1.5px">OUTER RING</text>
    <text x="0" y="20" style="font:13px Segoe UI,system-ui,sans-serif;fill:#4b5563">Integration surface</text>
    <text x="0" y="38" style="font:13px Segoe UI,system-ui,sans-serif;fill:#4b5563">(client toolchain)</text>
  </g>
  <g transform="translate(1230,118)">
    <text x="0" y="0" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">INNER RING</text>
    <text x="0" y="20" style="font:13px Segoe UI,system-ui,sans-serif;fill:#4b5563">Agent fleet</text>
    <text x="0" y="38" style="font:13px Segoe UI,system-ui,sans-serif;fill:#4b5563">(operates on the graph)</text>
  </g>
  <g transform="translate(40,808)">
    <text x="0" y="0" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#4b5563;letter-spacing:1.5px">CENTER</text>
    <text x="0" y="20" style="font:13px Segoe UI,system-ui,sans-serif;fill:#4b5563">The four-layer knowledge graph</text>
  </g>
</svg>
