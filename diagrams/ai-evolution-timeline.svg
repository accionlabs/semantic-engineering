  <circle cx="370"  cy="200" r="10" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-accent,#E94E1B);stroke-width:2.5;"/>
  <circle cx="580"  cy="200" r="10" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-accent,#E94E1B);stroke-width:2.5;"/>
  <circle cx="800"  cy="200" r="10" style="fill:var(--se-accent,#E94E1B);stroke:var(--se-accent,#E94E1B);"/>
