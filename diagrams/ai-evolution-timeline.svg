  <text x="800" y="372" text-anchor="middle" style="font-size:11px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">grounding pattern</text>
  <text x="800" y="396" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--se-accent,#E94E1B);">SE PATTERN BORN</text>

