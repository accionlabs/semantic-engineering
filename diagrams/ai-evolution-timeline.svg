  <text x="1680" y="256" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--se-text,#111111);">Methodology Named</text>
  <text x="1680" y="278" text-anchor="middle" style="font-size:11px;fill:var(--se-text-secondary,#4b5563);">Term Semantic Engineering</text>
  <text x="1680" y="294" text-anchor="middle" style="font-size:11px;fill:var(--se-text-secondary,#4b5563);">coined; methodology</text>
  <text x="1680" y="310" text-anchor="middle" style="font-size:11px;fill:var(--se-text-secondary,#4b5563);">formalized; commercial</text>
  <text x="1680" y="326" text-anchor="middle" style="font-size:11px;fill:var(--se-text-secondary,#4b5563);">practice rolled out</text>
  <text x="1680" y="356" text-anchor="middle" style="font-size:11px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">15M+ LOC modernized</text>
  <text x="1680" y="372" text-anchor="middle" style="font-size:11px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">Innovation Summit shared</text>
