  <circle cx="1240" cy="200" r="10" style="fill:var(--se-accent,#E94E1B);stroke:var(--se-accent,#E94E1B);"/>
  <circle cx="1460" cy="200" r="10" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-accent,#E94E1B);stroke-width:2.5;"/>
