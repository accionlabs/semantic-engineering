  <text x="1460" y="324" text-anchor="middle" style="font-size:11px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">Specialized agents per</text>
  <text x="1460" y="340" text-anchor="middle" style="font-size:11px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">ontology layer</text>

