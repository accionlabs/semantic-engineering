<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" preserveAspectRatio="xMidYMid meet" class="se-svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--se-arrow,#4b5563);"/>
    </marker>
  </defs>
  <text x="600" y="30" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-text,#111111);">Continuous SDLC Engagement: Four Phases</text>
  <text x="600" y="52" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Advise frames the work; Launch establishes the graph; Scale and Optimize compound the asset.</text>

  <rect x="40"   y="90" width="240" height="100" rx="14" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-box-stroke,#4b5563);stroke-width:1.5;"/>
  <text x="160" y="125" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--se-text,#111111);">Advise</text>
  <text x="160" y="150" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Diagnose the landscape</text>
  <text x="160" y="170" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">2 to 4 weeks</text>

  <rect x="320"  y="90" width="240" height="100" rx="14" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-box-stroke,#4b5563);stroke-width:1.5;"/>
  <text x="440" y="125" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--se-text,#111111);">Launch</text>
  <text x="440" y="150" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Extract and govern the graph</text>
  <text x="440" y="170" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">12 weeks</text>

  <rect x="600"  y="90" width="240" height="100" rx="14" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:2;"/>
  <text x="720" y="125" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--se-text,#111111);">Scale</text>
  <text x="720" y="150" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Multiple workstreams and products</text>
  <text x="720" y="170" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Quarters</text>

  <rect x="880"  y="90" width="280" height="100" rx="14" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:2;"/>
  <text x="1020" y="125" text-anchor="middle" style="font-size:16px;font-weight:700;fill:var(--se-text,#111111);">Optimize</text>
  <text x="1020" y="150" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Custodianship of the agent fleet</text>
  <text x="1020" y="170" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Continuous</text>

  <path d="M280,140 L320,140" marker-end="url(#ar)" style="stroke:var(--se-arrow,#4b5563);stroke-width:1.8;fill:none;"/>
  <path d="M560,140 L600,140" marker-end="url(#ar)" style="stroke:var(--se-arrow,#4b5563);stroke-width:1.8;fill:none;"/>
  <path d="M840,140 L880,140" marker-end="url(#ar)" style="stroke:var(--se-arrow,#4b5563);stroke-width:1.8;fill:none;"/>

  <text x="600" y="220" text-anchor="middle" style="font-size:11px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">Scale and Optimize are the value-compounding phases where the knowledge graph becomes the operating asset.</text>
</svg>
