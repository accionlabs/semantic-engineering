<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000"
     width="1400" height="1000"
     font-family="'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
     preserveAspectRatio="xMidYMid meet">

  <!-- =========================================================
       SPEC SPRINT PROCESS
       Sits above the knowledge graph in the methodology.
       Custodians collaborate in a time-boxed workshop and produce
       two outputs: graph updates + refined per-change specifications.
       Runs ahead of the per-change SDLC flow.
       ========================================================= -->

  <rect width="1400" height="1000" fill="#ffffff"/>

  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowCurate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E94E1B"/>
    </marker>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowSprint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="700" y="38" font-size="26" font-weight="700" text-anchor="middle" fill="#111111">Spec Sprint · Cross-Custodian Workshop</text>
  <text x="700" y="62" font-size="14" text-anchor="middle" fill="#4b5563">Custodians collaborate ahead of the per-change SDLC · output is graph updates AND refined specifications</text>

  <!-- ============================== EXTERNAL SIGNALS ============================== -->
  <text x="30" y="92" font-size="11" font-weight="700" fill="#4b5563" letter-spacing="1.5">EXTERNAL SIGNALS · INPUTS THE CUSTODIANS BRING TO THE SPRINT</text>

  <g id="signals">
    <g transform="translate(30, 100)"><rect width="200" height="58" rx="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">Business strategy</text><text x="100" y="38" font-size="10" text-anchor="middle" fill="#4b5563">customer conversations,</text><text x="100" y="52" font-size="10" text-anchor="middle" fill="#4b5563">executive priorities</text></g>
    <g transform="translate(258, 100)"><rect width="200" height="58" rx="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">User research</text><text x="100" y="38" font-size="10" text-anchor="middle" fill="#4b5563">interviews, support tickets,</text><text x="100" y="52" font-size="10" text-anchor="middle" fill="#4b5563">NPS patterns</text></g>
    <g transform="translate(486, 100)"><rect width="200" height="58" rx="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">Compliance</text><text x="100" y="38" font-size="10" text-anchor="middle" fill="#4b5563">regulatory shifts,</text><text x="100" y="52" font-size="10" text-anchor="middle" fill="#4b5563">jurisdiction obligations</text></g>
    <g transform="translate(714, 100)"><rect width="200" height="58" rx="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">Vendor contracts</text><text x="100" y="38" font-size="10" text-anchor="middle" fill="#4b5563">infrastructure cost,</text><text x="100" y="52" font-size="10" text-anchor="middle" fill="#4b5563">service constraints</text></g>
    <g transform="translate(942, 100)"><rect width="200" height="58" rx="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="20" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">Industry trends</text><text x="100" y="36" font-size="10" text-anchor="middle" fill="#4b5563">cloud, security, frameworks,</text><text x="100" y="50" font-size="10" text-anchor="middle" fill="#4b5563">accessibility, platforms</text></g>
    <g transform="translate(1170, 100)"><rect width="200" height="58" rx="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.5"/><text x="100" y="22" font-size="12" font-weight="600" text-anchor="middle" fill="#111111">Product trajectory</text><text x="100" y="38" font-size="10" text-anchor="middle" fill="#4b5563">velocity of change</text><text x="100" y="52" font-size="10" text-anchor="middle" fill="#4b5563">per area</text></g>
  </g>

  <!-- Layer band -->
  <g transform="translate(30, 170)">
    <path d="M 0 0 L 1340 0 L 1010 22 L 330 22 Z" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="670" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="#4b5563" letter-spacing="1.3">INTEGRATED BY THE CUSTODIANS</text>
  </g>

  <!-- Custodians (compact) -->
  <g id="custodians">
    <g transform="translate(40, 200)"><rect width="240" height="72" rx="36" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Product Owner</text><text x="120" y="48" font-size="11" text-anchor="middle" fill="#4b5563">holds the why</text></g>
    <g transform="translate(400, 200)"><rect width="240" height="72" rx="36" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Architect</text><text x="120" y="48" font-size="11" text-anchor="middle" fill="#4b5563">holds the where</text></g>
    <g transform="translate(760, 200)"><rect width="240" height="72" rx="36" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">UX Designer</text><text x="120" y="48" font-size="11" text-anchor="middle" fill="#4b5563">holds the how-it-looks</text></g>
    <g transform="translate(1120, 200)"><rect width="240" height="72" rx="36" fill="#ffffff" stroke="#4b5563" stroke-width="2.5"/><text x="120" y="28" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Engineering Team</text><text x="120" y="48" font-size="11" text-anchor="middle" fill="#4b5563">stewards Code Ontology</text></g>
  </g>

  <!-- Custodian → Spec Sprint arrows -->
  <g fill="none" stroke="#4b5563" stroke-width="3">
    <path d="M 160 272 L 160 320" marker-end="url(#arrowSprint)"/>
    <path d="M 520 272 L 520 320" marker-end="url(#arrowSprint)"/>
    <path d="M 880 272 L 880 320" marker-end="url(#arrowSprint)"/>
    <path d="M 1240 272 L 1240 320" marker-end="url(#arrowSprint)"/>
  </g>
  <text x="170" y="298" font-size="10" font-weight="700" fill="#4b5563">participates</text>
  <text x="530" y="298" font-size="10" font-weight="700" fill="#4b5563">participates</text>
  <text x="890" y="298" font-size="10" font-weight="700" fill="#4b5563">participates</text>
  <text x="1250" y="298" font-size="10" font-weight="700" fill="#4b5563">participates</text>

  <!-- ============================== SPEC SPRINT CONTAINER ============================== -->
  <rect x="20" y="328" width="1360" height="240" rx="12" fill="#fafafa" stroke="#4b5563" stroke-width="2.5" stroke-dasharray="10,5"/>
  <text x="700" y="354" font-size="17" font-weight="700" text-anchor="middle" fill="#4b5563">SPEC SPRINT WORKSHOP</text>
  <text x="700" y="376" font-size="11" font-style="italic" text-anchor="middle" fill="#4b5563">time-boxed 1-2 days · runs ahead of implementation sprints · iterative across pending change requests</text>

  <!-- 4 columns inside (one per custodian's contribution) -->
  <g id="sprint-columns">
    <g transform="translate(40, 395)">
      <rect width="280" height="160" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
      <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">Product Owner contributes</text>
      <text x="20" y="46" font-size="10.5" fill="#4b5563">· drafts spec from change request</text>
      <text x="20" y="64" font-size="10.5" fill="#4b5563">· defines personas, outcomes,</text>
      <text x="32" y="78" font-size="10.5" fill="#4b5563">scenarios, steps</text>
      <text x="20" y="98" font-size="10.5" fill="#4b5563">· proposes new Functional</text>
      <text x="32" y="112" font-size="10.5" fill="#4b5563">Ontology nodes if needed</text>
      <text x="20" y="132" font-size="10.5" fill="#4b5563">· negotiates scope against</text>
      <text x="32" y="146" font-size="10.5" fill="#4b5563">other change requests</text>
    </g>
    <g transform="translate(400, 395)">
      <rect width="280" height="160" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
      <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">Architect contributes</text>
      <text x="20" y="46" font-size="10.5" fill="#4b5563">· runs impact analysis</text>
      <text x="32" y="60" font-size="10.5" fill="#4b5563">against Architecture Ontology</text>
      <text x="20" y="80" font-size="10.5" fill="#4b5563">· flags boundary violations</text>
      <text x="32" y="94" font-size="10.5" fill="#4b5563">and service-ownership shifts</text>
      <text x="20" y="114" font-size="10.5" fill="#4b5563">· proposes graph updates if</text>
      <text x="32" y="128" font-size="10.5" fill="#4b5563">the change requires a new</text>
      <text x="32" y="142" font-size="10.5" fill="#4b5563">service or integration node</text>
    </g>
    <g transform="translate(760, 395)">
      <rect width="280" height="160" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
      <text x="140" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">UX Designer contributes</text>
      <text x="20" y="46" font-size="10.5" fill="#4b5563">· checks Design Ontology</text>
      <text x="32" y="60" font-size="10.5" fill="#4b5563">for reusable components</text>
      <text x="20" y="80" font-size="10.5" fill="#4b5563">· decides whether the change</text>
      <text x="32" y="94" font-size="10.5" fill="#4b5563">needs new design primitives</text>
      <text x="20" y="114" font-size="10.5" fill="#4b5563">· proposes Design Ontology</text>
      <text x="32" y="128" font-size="10.5" fill="#4b5563">updates for new patterns</text>
    </g>
    <g transform="translate(1120, 395)">
      <rect width="240" height="160" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
      <text x="120" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">Engineering contributes</text>
      <text x="14" y="46" font-size="10.5" fill="#4b5563">· verifies Code Ontology</text>
      <text x="26" y="60" font-size="10.5" fill="#4b5563">touchpoints are current</text>
      <text x="14" y="80" font-size="10.5" fill="#4b5563">· flags refactor candidates</text>
      <text x="26" y="94" font-size="10.5" fill="#4b5563">surfaced by the spec</text>
      <text x="14" y="114" font-size="10.5" fill="#4b5563">· estimates implementation</text>
      <text x="26" y="128" font-size="10.5" fill="#4b5563">cost; calibrates batching</text>
    </g>
  </g>

  <!-- ============================== TWO OUTPUTS ============================== -->
  <text x="30" y="600" font-size="11" font-weight="700" fill="#4b5563" letter-spacing="1.5">SPRINT OUTPUTS · TWO PARALLEL ARTIFACTS PER CHANGE</text>

  <!-- Output arrow LEFT (to knowledge graph) -->
  <g fill="none" stroke="#E94E1B" stroke-width="3">
    <path d="M 350 568 L 350 632" marker-end="url(#arrowCurate)"/>
  </g>
  <text x="362" y="606" font-size="11" font-weight="700" fill="#E94E1B">graph updates</text>

  <!-- Output arrow RIGHT (to specifications) -->
  <g fill="none" stroke="#4b5563" stroke-width="3">
    <path d="M 1050 568 L 1050 632" marker-end="url(#arrowFlow)"/>
  </g>
  <text x="1062" y="606" font-size="11" font-weight="700" fill="#4b5563">well-formed specs</text>

  <!-- LEFT output: Knowledge graph -->
  <rect x="20" y="640" width="660" height="160" rx="10" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="350" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#E94E1B" letter-spacing="1.2">FOUR-LAYER KNOWLEDGE GRAPH (UPDATED)</text>

  <g transform="translate(35, 678)">
    <rect width="150" height="108" rx="6" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2"/>
    <text x="75" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Functional</text>
    <text x="75" y="36" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Ontology</text>
    <text x="75" y="58" font-size="9" text-anchor="middle" fill="#4b5563">new personas,</text>
    <text x="75" y="72" font-size="9" text-anchor="middle" fill="#4b5563">outcomes, scenarios</text>
    <text x="75" y="94" font-size="9" font-style="italic" text-anchor="middle" fill="#E94E1B">by PO</text>
  </g>
  <g transform="translate(195, 678)">
    <rect width="150" height="108" rx="6" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2"/>
    <text x="75" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Architecture</text>
    <text x="75" y="36" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Ontology</text>
    <text x="75" y="58" font-size="9" text-anchor="middle" fill="#4b5563">new services,</text>
    <text x="75" y="72" font-size="9" text-anchor="middle" fill="#4b5563">boundaries, contracts</text>
    <text x="75" y="94" font-size="9" font-style="italic" text-anchor="middle" fill="#E94E1B">by Architect</text>
  </g>
  <g transform="translate(355, 678)">
    <rect width="150" height="108" rx="6" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2"/>
    <text x="75" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Design</text>
    <text x="75" y="36" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Ontology</text>
    <text x="75" y="58" font-size="9" text-anchor="middle" fill="#4b5563">new components,</text>
    <text x="75" y="72" font-size="9" text-anchor="middle" fill="#4b5563">flows, patterns</text>
    <text x="75" y="94" font-size="9" font-style="italic" text-anchor="middle" fill="#E94E1B">by Designer</text>
  </g>
  <g transform="translate(515, 678)">
    <rect width="150" height="108" rx="6" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2"/>
    <text x="75" y="22" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Code</text>
    <text x="75" y="36" font-size="11" font-weight="700" text-anchor="middle" fill="#111111">Ontology</text>
    <text x="75" y="58" font-size="9" text-anchor="middle" fill="#4b5563">touchpoint validation,</text>
    <text x="75" y="72" font-size="9" text-anchor="middle" fill="#4b5563">refactor flags</text>
    <text x="75" y="94" font-size="9" font-style="italic" text-anchor="middle" fill="#E94E1B">by Engineering</text>
  </g>

  <!-- RIGHT output: Specifications stream -->
  <rect x="720" y="640" width="660" height="160" rx="10" fill="#f5f5f5" stroke="#4b5563" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="1050" y="664" font-size="12" font-weight="700" text-anchor="middle" fill="#4b5563" letter-spacing="1.2">REFINED SPECIFICATIONS · QUEUED FOR THE PER-CHANGE SDLC</text>

  <!-- Multiple spec icons to show stream of specs -->
  <g transform="translate(740, 678)">
    <rect width="190" height="108" rx="5" fill="#fafafa" stroke="#4b5563" stroke-width="2"/>
    <text x="95" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">Spec · change A</text>
    <text x="95" y="42" font-size="9.5" text-anchor="middle" fill="#4b5563">PO outcome anchored;</text>
    <text x="95" y="56" font-size="9.5" text-anchor="middle" fill="#4b5563">architect approved;</text>
    <text x="95" y="70" font-size="9.5" text-anchor="middle" fill="#4b5563">design components named;</text>
    <text x="95" y="84" font-size="9.5" text-anchor="middle" fill="#4b5563">code touchpoints listed</text>
    <text x="95" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#4b5563">well-formed</text>
  </g>
  <g transform="translate(940, 678)">
    <rect width="190" height="108" rx="5" fill="#fafafa" stroke="#4b5563" stroke-width="2"/>
    <text x="95" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">Spec · change B</text>
    <text x="95" y="42" font-size="9.5" text-anchor="middle" fill="#4b5563">PO outcome anchored;</text>
    <text x="95" y="56" font-size="9.5" text-anchor="middle" fill="#4b5563">architect approved;</text>
    <text x="95" y="70" font-size="9.5" text-anchor="middle" fill="#4b5563">design components named;</text>
    <text x="95" y="84" font-size="9.5" text-anchor="middle" fill="#4b5563">code touchpoints listed</text>
    <text x="95" y="100" font-size="9" font-style="italic" text-anchor="middle" fill="#4b5563">well-formed</text>
  </g>
  <g transform="translate(1140, 678)">
    <rect width="220" height="108" rx="5" fill="#fafafa" stroke="#4b5563" stroke-width="2"/>
    <text x="110" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#111111">Spec · change C, D, ...</text>
    <text x="110" y="42" font-size="9.5" text-anchor="middle" fill="#4b5563">whole batch refined</text>
    <text x="110" y="56" font-size="9.5" text-anchor="middle" fill="#4b5563">in the same sprint</text>
    <text x="110" y="78" font-size="9.5" font-style="italic" text-anchor="middle" fill="#4b5563">→ feed per-change SDLC flow</text>
    <text x="110" y="92" font-size="9.5" font-style="italic" text-anchor="middle" fill="#4b5563">in the implementation sprint</text>
  </g>

  <!-- Downstream pointer notes -->
  <text x="350" y="828" font-size="10.5" font-style="italic" text-anchor="middle" fill="#E94E1B">graph stays current → every subsequent change benefits</text>
  <text x="1050" y="828" font-size="10.5" font-style="italic" text-anchor="middle" fill="#4b5563">specs enter the per-change SDLC flow shown on the Stages page</text>

  <!-- LEGEND -->
  <g transform="translate(40, 880)" font-size="10.5">
    <text x="0" y="0" font-weight="700" fill="#4b5563" letter-spacing="1.2">LEGEND</text>
    <g transform="translate(0, 22)">
      <line x1="0" y1="6" x2="40" y2="6" stroke="#4b5563" stroke-width="3" marker-end="url(#arrowSprint)"/>
      <text x="50" y="10" fill="#4b5563">custodian participates in sprint</text>
    </g>
    <g transform="translate(260, 22)">
      <line x1="0" y1="6" x2="40" y2="6" stroke="#E94E1B" stroke-width="3" marker-end="url(#arrowCurate)"/>
      <text x="50" y="10" fill="#4b5563">graph update output</text>
    </g>
    <g transform="translate(470, 22)">
      <line x1="0" y1="6" x2="40" y2="6" stroke="#4b5563" stroke-width="3" marker-end="url(#arrowFlow)"/>
      <text x="50" y="10" fill="#4b5563">spec output</text>
    </g>
    <g transform="translate(620, 22)">
      <rect x="0" y="-2" width="22" height="16" rx="3" fill="#fafafa" stroke="#4b5563" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="32" y="10" fill="#4b5563">workshop container</text>
    </g>
    <g transform="translate(800, 22)">
      <rect x="0" y="-2" width="22" height="16" rx="3" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2"/>
      <text x="32" y="10" fill="#4b5563">green: knowledge graph</text>
    </g>
    <g transform="translate(1010, 22)">
      <rect x="0" y="-2" width="22" height="16" rx="3" fill="#fafafa" stroke="#4b5563" stroke-width="2"/>
      <text x="32" y="10" fill="#4b5563">yellow: refined specification</text>
    </g>
  </g>
</svg>
