<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" width="1200" height="700" preserveAspectRatio="xMidYMid meet" class="se-svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--se-text-secondary,#4b5563)"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--se-accent,#E94E1B)"/></marker>
    <style>
      .h1 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 600; fill: var(--se-text,#111111); }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; fill: var(--se-text-secondary,#4b5563); }
      .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--se-text-secondary,#4b5563); letter-spacing: 2px; }
      .dim { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: var(--se-text,#111111); }
      .chip { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: var(--se-text,#111111); }
      .role { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 600; fill: var(--se-text,#111111); }
      .roleSub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: var(--se-text,#111111); }
      .ont { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: var(--se-text,#111111); }
      .ontSub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: var(--se-text-secondary,#4b5563); }
      .ital { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-style: italic; fill: var(--se-text-secondary,#4b5563); }
      .judg { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: var(--se-text,#111111); }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="h1">What the Engineering Team Holds</text>
  <text x="600" y="70" text-anchor="middle" class="sub">Distributed codebase knowledge that gets codified, plus three judgments that stay human.</text>

  <text x="60" y="110" class="label">CODEBASE TACIT KNOWLEDGE · DISTRIBUTED ACROSS TEAMS</text>

  <rect x="60" y="125" width="1080" height="110" rx="10" ry="10" style="fill:var(--se-box-fill,#ffffff)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <rect x="80" y="145" width="170" height="70" rx="6" ry="6" fill="var(--se-panel-fill,#f5f5f5)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1"/>
  <text x="165" y="170" text-anchor="middle" class="chip" font-weight="600">Orders team</text>
  <text x="165" y="190" text-anchor="middle" class="chip">retry policies,</text>
  <text x="165" y="206" text-anchor="middle" class="chip">tax workarounds</text>

  <rect x="265" y="145" width="170" height="70" rx="6" ry="6" fill="var(--se-panel-fill,#f5f5f5)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1"/>
  <text x="350" y="170" text-anchor="middle" class="chip" font-weight="600">Catalog team</text>
  <text x="350" y="190" text-anchor="middle" class="chip">utility lib choices,</text>
  <text x="350" y="206" text-anchor="middle" class="chip">flag history</text>

  <rect x="450" y="145" width="170" height="70" rx="6" ry="6" fill="var(--se-panel-fill,#f5f5f5)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1"/>
  <text x="535" y="170" text-anchor="middle" class="chip" font-weight="600">Billing team</text>
  <text x="535" y="190" text-anchor="middle" class="chip">forked email lib,</text>
  <text x="535" y="206" text-anchor="middle" class="chip">cron stop-gaps</text>

  <rect x="635" y="145" width="170" height="70" rx="6" ry="6" fill="var(--se-panel-fill,#f5f5f5)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1"/>
  <text x="720" y="170" text-anchor="middle" class="chip" font-weight="600">Auth team</text>
  <text x="720" y="190" text-anchor="middle" class="chip">session token shape,</text>
  <text x="720" y="206" text-anchor="middle" class="chip">refactor history</text>

  <rect x="820" y="145" width="170" height="70" rx="6" ry="6" fill="var(--se-panel-fill,#f5f5f5)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1"/>
  <text x="905" y="170" text-anchor="middle" class="chip" font-weight="600">Platform team</text>
  <text x="905" y="190" text-anchor="middle" class="chip">infra patterns,</text>
  <text x="905" y="206" text-anchor="middle" class="chip">SLA carve-outs</text>

  <rect x="1005" y="145" width="125" height="70" rx="6" ry="6" fill="var(--se-panel-fill,#f5f5f5)" stroke="var(--se-panel-stroke,#9ca3af)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="1067" y="170" text-anchor="middle" class="chip" font-weight="600" fill="var(--se-panel-stroke,#9ca3af)">Original</text>
  <text x="1067" y="190" text-anchor="middle" class="chip" fill="var(--se-panel-stroke,#9ca3af)">author</text>
  <text x="1067" y="206" text-anchor="middle" class="chip" fill="var(--se-panel-stroke,#9ca3af)">left or moved</text>

  <path d="M 600 235 L 600 280" stroke="var(--se-accent,#E94E1B)" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="620" y="262" class="ital" fill="var(--se-accent,#E94E1B)">brownfield extraction (AST + LLM enrichment)</text>

  <text x="60" y="305" class="label">EXTRACTED INTO THE GRAPH · THREE JUDGMENTS STAY HUMAN</text>

  <rect x="60" y="320" width="350" height="180" rx="10" ry="10" style="fill:var(--se-box-fill,#ffffff)" stroke="var(--se-text-secondary,#4b5563)" stroke-width="1.5"/>
  <text x="235" y="350" text-anchor="middle" class="judg">Implementation judgment</text>
  <text x="235" y="370" text-anchor="middle" class="ontSub">per change</text>
  <text x="235" y="403" text-anchor="middle" class="chip">Reads the agent's output.</text>
  <text x="235" y="421" text-anchor="middle" class="chip">Catches edge cases the spec</text>
  <text x="235" y="439" text-anchor="middle" class="chip">missed. Knows when</text>
  <text x="235" y="457" text-anchor="middle" class="chip">locally-correct code creates a</text>
  <text x="235" y="475" text-anchor="middle" class="chip">maintainability problem in</text>
  <text x="235" y="493" text-anchor="middle" class="chip">two years.</text>

  <rect x="425" y="320" width="350" height="180" rx="10" ry="10" style="fill:var(--se-box-fill,#ffffff)" stroke="var(--se-text-secondary,#4b5563)" stroke-width="1.5"/>
  <text x="600" y="350" text-anchor="middle" class="judg">Refactor + pattern evolution</text>
  <text x="600" y="370" text-anchor="middle" class="ontSub">across sprints</text>
  <text x="600" y="403" text-anchor="middle" class="chip">Decides which areas migrate first,</text>
  <text x="600" y="421" text-anchor="middle" class="chip">which to grandfather, how to split</text>
  <text x="600" y="439" text-anchor="middle" class="chip">the work across sprints without</text>
  <text x="600" y="457" text-anchor="middle" class="chip">breaking ongoing feature work.</text>
  <text x="600" y="475" text-anchor="middle" class="chip">Calls the target structure and</text>
  <text x="600" y="493" text-anchor="middle" class="chip">realistic timeline.</text>

  <rect x="790" y="320" width="350" height="180" rx="10" ry="10" style="fill:var(--se-box-fill,#ffffff)" stroke="var(--se-text-secondary,#4b5563)" stroke-width="1.5"/>
  <text x="965" y="350" text-anchor="middle" class="judg">Stewardship over fragmentation</text>
  <text x="965" y="370" text-anchor="middle" class="ontSub">collective team activity</text>
  <text x="965" y="403" text-anchor="middle" class="chip">Reviews rationalization findings.</text>
  <text x="965" y="421" text-anchor="middle" class="chip">Decides which patterns the team</text>
  <text x="965" y="439" text-anchor="middle" class="chip">commits to, which legacy patterns</text>
  <text x="965" y="457" text-anchor="middle" class="chip">to retire, which exceptions are</text>
  <text x="965" y="475" text-anchor="middle" class="chip">deliberate vs accidental. Decides</text>
  <text x="965" y="493" text-anchor="middle" class="chip">which structural debt to pay off.</text>

  <text x="60" y="535" class="label">ROLE · STAYS HUMAN</text>

  <rect x="300" y="550" width="600" height="80" rx="12" ry="12" fill="var(--se-accent-fill,#FDE8DD)" stroke="var(--se-accent,#E94E1B)" stroke-width="2.5"/>
  <text x="600" y="580" text-anchor="middle" class="role">Engineering Team</text>
  <text x="600" y="610" text-anchor="middle" class="roleSub">Code extracted into the graph; three judgments remain</text>

  <path d="M 600 630 L 600 670" stroke="var(--se-accent,#E94E1B)" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

  <text x="600" y="690" text-anchor="middle" class="ont">→ Code Ontology · modules · classes · functions · endpoints · schemas</text>
</svg>
