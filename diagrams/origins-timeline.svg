<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" preserveAspectRatio="xMidYMid meet" class="se-svg">
  <text x="800" y="45" text-anchor="middle" style="font-size:26px;font-weight:700;fill:var(--se-text,#111111);">The Path to Semantic Engineering</text>
  <text x="800" y="72" text-anchor="middle" style="font-size:15px;fill:var(--se-text-secondary,#4b5563);">From a 2017 internal framework to a 2023 commercial KG practice to the 2025 naming of the methodology.</text>

  <!-- horizontal axis line -->
  <line x1="80" y1="140" x2="1520" y2="140" style="stroke:var(--se-text-secondary,#4b5563);stroke-width:2;"/>

  <!-- 6 dots -->
  <circle cx="180"  cy="140" r="12" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-text-secondary,#4b5563);stroke-width:2;"/>
  <circle cx="440"  cy="140" r="12" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-text-secondary,#4b5563);stroke-width:2;"/>
  <circle cx="700"  cy="140" r="12" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:2.5;"/>
  <circle cx="960"  cy="140" r="12" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-text-secondary,#4b5563);stroke-width:2;"/>
  <circle cx="1220" cy="140" r="12" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-text-secondary,#4b5563);stroke-width:2;"/>
  <circle cx="1480" cy="140" r="14" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:2.5;"/>

  <!-- Year labels (above the line) -->
  <text x="180"  y="110" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-text,#111111);">2017</text>
  <text x="440"  y="110" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-text,#111111);">Q1 2022</text>
  <text x="700"  y="110" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-accent,#E94E1B);">2023</text>
  <text x="960"  y="110" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-text,#111111);">2024</text>
  <text x="1220" y="110" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-text,#111111);">2024</text>
  <text x="1480" y="110" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-accent,#E94E1B);">2025-26</text>

  <!-- 2017 Breeze framework -->
  <rect x="60"   y="170" width="240" height="120" rx="10" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-text-secondary,#4b5563);stroke-width:1.2;"/>
  <text x="180" y="196" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--se-text,#111111);">Breeze framework</text>
  <text x="180" y="222" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">Manual blueprint for the</text>
  <text x="180" y="240" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">PO, architect, UX designer</text>
  <text x="180" y="258" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">roles. Internal framework</text>
  <text x="180" y="276" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">used on every engagement.</text>
  <text x="180" y="308" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">guidelines + templates</text>
  <text x="180" y="326" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">maintained by hand</text>

  <!-- Q1 2022 First GenAI project -->
  <rect x="320"  y="170" width="240" height="120" rx="10" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-text-secondary,#4b5563);stroke-width:1.2;"/>
  <text x="440" y="196" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--se-text,#111111);">First GenAI project</text>
  <text x="440" y="222" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">Drug discovery for a</text>
  <text x="440" y="240" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">pharma leader. Hallucinations</text>
  <text x="440" y="258" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">fixed by a decision tree of</text>
  <text x="440" y="276" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">validated pathways.</text>
  <text x="440" y="308" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">knowledge graph as</text>
  <text x="440" y="326" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">constraint pattern proven</text>

  <!-- 2023 KAPS (NEW) -->
  <rect x="580"  y="170" width="240" height="120" rx="10" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:1.8;"/>
  <text x="700" y="196" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--se-text,#111111);">KAPS</text>
  <text x="700" y="222" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">Knowledge graph approach</text>
  <text x="700" y="240" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">productized as a commercial</text>
  <text x="700" y="258" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">platform. Methodology in use</text>
  <text x="700" y="276" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">across customer engagements.</text>
  <text x="700" y="308" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-accent,#E94E1B);">commercial KG practice,</text>
  <text x="700" y="326" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-accent,#E94E1B);">before the name existed</text>

  <!-- 2024 Breeze.AI -->
  <rect x="840"  y="170" width="240" height="120" rx="10" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-text-secondary,#4b5563);stroke-width:1.2;"/>
  <text x="960" y="196" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--se-text,#111111);">Breeze.AI</text>
  <text x="960" y="222" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">2017 Breeze guidelines</text>
  <text x="960" y="240" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">converted into the four</text>
  <text x="960" y="258" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">graph ontologies. Custom</text>
  <text x="960" y="276" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">agents populate and query.</text>
  <text x="960" y="308" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">agent fleet operating</text>
  <text x="960" y="326" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">on the four-layer graph</text>

  <!-- 2024 ASIMOV -->
  <rect x="1100" y="170" width="240" height="120" rx="10" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-accent,#E94E1B);stroke-width:1.2;"/>
  <text x="1220" y="196" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--se-text,#111111);">ASIMOV</text>
  <text x="1220" y="222" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">Agentic framework</text>
  <text x="1220" y="240" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">for automated legacy</text>
  <text x="1220" y="258" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">modernization at scale.</text>
  <text x="1220" y="276" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">Functional parity preserved.</text>
  <text x="1220" y="312" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">legacy stacks to modern</text>
  <text x="1220" y="330" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-text-secondary,#4b5563);">stacks, agent-driven</text>

  <!-- 2025-26 Methodology Named (RENAMED) -->
  <rect x="1360" y="170" width="240" height="120" rx="10" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:1.8;"/>
  <text x="1480" y="196" text-anchor="middle" style="font-size:17px;font-weight:700;fill:var(--se-text,#111111);">Methodology Named</text>
  <text x="1480" y="222" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">Term Semantic Engineering</text>
  <text x="1480" y="240" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">coined. Methodology</text>
  <text x="1480" y="258" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">formalized, enablement</text>
  <text x="1480" y="276" text-anchor="middle" style="font-size:14px;fill:var(--se-text-secondary,#4b5563);">discipline codified.</text>
  <text x="1480" y="308" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-accent,#E94E1B);">formal methodology</text>
  <text x="1480" y="326" text-anchor="middle" style="font-size:14px;font-style:italic;fill:var(--se-accent,#E94E1B);">+ operating model</text>
</svg>
