<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" width="1200" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E94E1B"/></marker>
    <style>
      .h1 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 24px; font-weight: 600; fill: #111111; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; fill: #4b5563; }
      .label { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #4b5563; letter-spacing: 2px; }
      .dim { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #111111; }
      .chip { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #111111; }
      .role { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 22px; font-weight: 600; fill: #111111; }
      .roleSub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #111111; }
      .ont { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 17px; font-weight: 600; fill: #111111; }
      .ontSub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #4b5563; }
      .ital { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-style: italic; fill: #4b5563; }
    </style>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="h1">What the UX Designer Holds</text>
  <text x="600" y="70" text-anchor="middle" class="sub">Granular user needs and strategic-scale brand, accessibility, and industry-trend commitments.</text>

  <text x="60" y="110" class="label">TWO LAYERS · EACH FED BY HUMAN-ONLY OBSERVATION</text>

  <rect x="60" y="125" width="525" height="220" rx="10" ry="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="322" y="155" text-anchor="middle" class="dim">Granular User Needs</text>

  <rect x="80" y="175" width="220" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="190" y="195" text-anchor="middle" class="chip">in-truck-cab interviews</text>
  <rect x="315" y="175" width="250" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="195" text-anchor="middle" class="chip">support-ticket pattern reads</text>

  <rect x="80" y="215" width="220" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="190" y="235" text-anchor="middle" class="chip">usability-test body language</text>
  <rect x="315" y="215" width="250" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="440" y="235" text-anchor="middle" class="chip">NPS dip segment analysis</text>

  <rect x="80" y="255" width="485" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="322" y="275" text-anchor="middle" class="chip">field observation that users will not name out loud</text>

  <text x="322" y="320" text-anchor="middle" class="ital">e.g. "technicians checking the app at red lights;</text>
  <text x="322" y="337" text-anchor="middle" class="ital">one extra line above the address field, problem gone"</text>

  <rect x="615" y="125" width="525" height="220" rx="10" ry="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="877" y="155" text-anchor="middle" class="dim">Strategic-Scale Decisions</text>

  <rect x="635" y="175" width="220" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="745" y="195" text-anchor="middle" class="chip">brand voice (with marketing)</text>
  <rect x="870" y="175" width="250" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="995" y="195" text-anchor="middle" class="chip">accessibility commitments</text>

  <rect x="635" y="215" width="220" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="745" y="235" text-anchor="middle" class="chip">component deprecation calls</text>
  <rect x="870" y="215" width="250" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="995" y="235" text-anchor="middle" class="chip">WCAG + jurisdiction obligations</text>

  <rect x="635" y="255" width="485" height="32" rx="5" ry="5" fill="#f5f5f5" stroke="#9ca3af" stroke-width="1"/>
  <text x="877" y="275" text-anchor="middle" class="chip">industry shifts: Apple, Google, Microsoft platform guidelines</text>

  <text x="877" y="320" text-anchor="middle" class="ital">e.g. "this interaction pattern fits the brand</text>
  <text x="877" y="337" text-anchor="middle" class="ital">for these users in this regulatory context"</text>

  <path d="M 322 345 L 480 405" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 877 345 L 720 405" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <text x="60" y="395" class="label">ROLE · STAYS HUMAN</text>

  <rect x="300" y="410" width="600" height="100" rx="12" ry="12" fill="#FDE8DD" stroke="#E94E1B" stroke-width="2.5"/>
  <text x="600" y="445" text-anchor="middle" class="role">UX Designer</text>
  <text x="600" y="472" text-anchor="middle" class="roleSub">Recognizes the shape of a problem users will not name</text>
  <text x="600" y="492" text-anchor="middle" class="roleSub">out loud. Decides which industry shifts the team adopts.</text>

  <path d="M 600 510 L 600 565" stroke="#E94E1B" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>

  <text x="60" y="590" class="label">OUTPUT · WRITTEN INTO THE GRAPH</text>

  <rect x="200" y="605" width="800" height="50" rx="10" ry="10" fill="#f5f5f5" stroke="#4b5563" stroke-width="1.5"/>
  <text x="600" y="628" text-anchor="middle" class="ont">Design Ontology</text>
  <text x="600" y="648" text-anchor="middle" class="ontSub">components · flows · templates · design tokens · journey maps</text>
</svg>
