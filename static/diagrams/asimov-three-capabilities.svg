<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" width="1400" height="740" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="cap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" style="fill:#4b5563"/>
    </marker>
  </defs>
  <rect width="1400" height="740" style="fill:#ffffff"/>

  <text x="700" y="44" text-anchor="middle" style="font:600 28px Segoe UI,system-ui,sans-serif;fill:#111111">Three Core Capabilities of ASIMOV</text>
  <text x="700" y="72" text-anchor="middle" style="font:17px Segoe UI,system-ui,sans-serif;fill:#4b5563">Same architecture and the same agentic execution. Only the Target Ontology Configurator and per-language adapters differ.</text>

  <!-- Capability 1: Legacy System Renewal -->
  <g transform="translate(40,120)">
    <rect x="0" y="0" width="430" height="500" rx="14" ry="14" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:2"/>
    <rect x="0" y="0" width="430" height="60" rx="14" ry="14" style="fill:#4b5563"/>
    <rect x="0" y="46" width="430" height="14" style="fill:#4b5563"/>
    <text x="22" y="38" style="font:700 18px Segoe UI,system-ui,sans-serif;fill:#ffffff">01</text>
    <text x="80" y="38" style="font:700 18px Segoe UI,system-ui,sans-serif;fill:#ffffff">Legacy System Renewal</text>

    <!-- Icon: bridge from old to new -->
    <g transform="translate(135,82)">
      <rect x="0" y="0" width="50" height="60" rx="6" ry="6" style="fill:#9ca3af"/>
      <text x="25" y="35" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#ffffff">old</text>
      <line x1="55" y1="30" x2="105" y2="30" style="stroke:#E94E1B;stroke-width:3" marker-end="url(#cap-arrow)"/>
      <rect x="110" y="0" width="50" height="60" rx="6" ry="6" style="fill:#E94E1B"/>
      <text x="135" y="35" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#ffffff">new</text>
    </g>

    <text x="22" y="180" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">WHAT IT COVERS</text>
    <text x="22" y="206" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">End-to-end transformation of legacy</text>
    <text x="22" y="224" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">codebases into modern, reliable stacks.</text>
    <text x="22" y="242" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">Breaks free from obsolete platforms;</text>
    <text x="22" y="260" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">reduces technical debt; positions for</text>
    <text x="22" y="278" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">long-term innovation and scalability.</text>

    <line x1="22" y1="306" x2="408" y2="306" style="stroke:#9ca3af;stroke-width:1"/>

    <text x="22" y="334" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">TYPICAL EXAMPLES</text>
    <g transform="translate(22,352)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#4b5563;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">COBOL</tspan> on mainframe → <tspan font-weight="700">Java</tspan> on cloud</text>
    </g>
    <g transform="translate(22,392)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#4b5563;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">Delphi</tspan> → <tspan font-weight="700">C# / .NET 8</tspan> plus React</text>
    </g>
    <g transform="translate(22,432)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#4b5563;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">VB.NET</tspan> → <tspan font-weight="700">.NET Core / .NET 8</tspan></text>
    </g>
    <g transform="translate(22,472)">
      <rect x="0" y="0" width="386" height="14" style="fill:none"/>
    </g>
  </g>

  <!-- Capability 2: Scalable Architecture Redesign -->
  <g transform="translate(485,120)">
    <rect x="0" y="0" width="430" height="500" rx="14" ry="14" style="fill:#FDE8DD;stroke:#E94E1B;stroke-width:2"/>
    <rect x="0" y="0" width="430" height="60" rx="14" ry="14" style="fill:#E94E1B"/>
    <rect x="0" y="46" width="430" height="14" style="fill:#E94E1B"/>
    <text x="22" y="38" style="font:700 18px Segoe UI,system-ui,sans-serif;fill:#ffffff">02</text>
    <text x="80" y="38" style="font:700 18px Segoe UI,system-ui,sans-serif;fill:#ffffff">Scalable Architecture Redesign</text>

    <!-- Icon: monolith fragmenting into microservices -->
    <g transform="translate(135,82)">
      <rect x="0" y="0" width="50" height="60" rx="6" ry="6" style="fill:#4b5563"/>
      <text x="25" y="35" text-anchor="middle" style="font:700 11px Segoe UI,system-ui,sans-serif;fill:#ffffff">mono</text>
      <line x1="55" y1="30" x2="105" y2="30" style="stroke:#E94E1B;stroke-width:3" marker-end="url(#cap-arrow)"/>
      <g transform="translate(110,0)">
        <rect x="0" y="0" width="22" height="22" rx="4" ry="4" style="fill:#E94E1B"/>
        <rect x="28" y="0" width="22" height="22" rx="4" ry="4" style="fill:#E94E1B"/>
        <rect x="0" y="38" width="22" height="22" rx="4" ry="4" style="fill:#E94E1B"/>
        <rect x="28" y="38" width="22" height="22" rx="4" ry="4" style="fill:#E94E1B"/>
      </g>
    </g>

    <text x="22" y="180" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">WHAT IT COVERS</text>
    <text x="22" y="206" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">Structured path to a modern modular</text>
    <text x="22" y="224" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">design. Intelligent analysis and guided</text>
    <text x="22" y="242" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">transformation move the application</text>
    <text x="22" y="260" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">from monolith to microservices, or from</text>
    <text x="22" y="278" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">tightly coupled to modular.</text>

    <line x1="22" y1="306" x2="408" y2="306" style="stroke:#E94E1B;stroke-width:1;opacity:0.4"/>

    <text x="22" y="334" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">TYPICAL EXAMPLES</text>
    <g transform="translate(22,352)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">.NET 4.5 monolith</tspan> → <tspan font-weight="700">.NET Core 8</tspan> microservices</text>
    </g>
    <g transform="translate(22,392)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">ASP.NET 4.5</tspan> → <tspan font-weight="700">.NET Core 10</tspan> + React 19</text>
    </g>
    <g transform="translate(22,432)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#E94E1B;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111">VB.NET tightly coupled → <tspan font-weight="700">.NET Core modular</tspan></text>
    </g>
  </g>

  <!-- Capability 3: AI-Guided Upgrades -->
  <g transform="translate(930,120)">
    <rect x="0" y="0" width="430" height="500" rx="14" ry="14" style="fill:#f5f5f5;stroke:#4b5563;stroke-width:2"/>
    <rect x="0" y="0" width="430" height="60" rx="14" ry="14" style="fill:#4b5563"/>
    <rect x="0" y="46" width="430" height="14" style="fill:#4b5563"/>
    <text x="22" y="38" style="font:700 18px Segoe UI,system-ui,sans-serif;fill:#ffffff">03</text>
    <text x="80" y="38" style="font:700 18px Segoe UI,system-ui,sans-serif;fill:#ffffff">AI-Guided Upgrades</text>

    <!-- Icon: version stepping up -->
    <g transform="translate(135,82)">
      <rect x="0" y="20" width="40" height="40" rx="4" ry="4" style="fill:#9ca3af"/>
      <text x="20" y="44" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#ffffff">v.N</text>
      <rect x="55" y="10" width="40" height="50" rx="4" ry="4" style="fill:#9ca3af"/>
      <text x="75" y="40" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#ffffff">v.N+1</text>
      <rect x="110" y="0" width="40" height="60" rx="4" ry="4" style="fill:#E94E1B"/>
      <text x="130" y="35" text-anchor="middle" style="font:700 12px Segoe UI,system-ui,sans-serif;fill:#ffffff">v.N+x</text>
    </g>

    <text x="22" y="180" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">WHAT IT COVERS</text>
    <text x="22" y="206" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">Rapid version upgrades within a</text>
    <text x="22" y="224" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">technology family. Automated code</text>
    <text x="22" y="242" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">scanning, dependency mapping,</text>
    <text x="22" y="260" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">compatibility recommendations. Keeps</text>
    <text x="22" y="278" style="font:14px Segoe UI,system-ui,sans-serif;fill:#111111">systems secure, compliant, performant.</text>

    <line x1="22" y1="306" x2="408" y2="306" style="stroke:#9ca3af;stroke-width:1"/>

    <text x="22" y="334" style="font:700 13px Segoe UI,system-ui,sans-serif;fill:#E94E1B;letter-spacing:1.5px">TYPICAL EXAMPLES</text>
    <g transform="translate(22,352)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#4b5563;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">Java 8</tspan> → <tspan font-weight="700">Java 21</tspan></text>
    </g>
    <g transform="translate(22,392)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#4b5563;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">Angular 0</tspan> → <tspan font-weight="700">Angular 16</tspan> (+)</text>
    </g>
    <g transform="translate(22,432)">
      <rect x="0" y="0" width="386" height="32" rx="6" ry="6" style="fill:#ffffff;stroke:#4b5563;stroke-width:1.5"/>
      <text x="14" y="22" style="font:13px Segoe UI,system-ui,sans-serif;fill:#111111"><tspan font-weight="700">Struts</tspan> → <tspan font-weight="700">Spring MVC</tspan></text>
    </g>
  </g>

  <!-- Bottom note -->
  <text x="700" y="680" text-anchor="middle" style="font:italic 14px Segoe UI,system-ui,sans-serif;fill:#4b5563">All three run through the same Ingestion → Transformation → Generation pipeline, with the Target Ontology Configurator and per-language adapters tuned to the path.</text>
</svg>
