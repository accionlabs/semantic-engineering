<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" preserveAspectRatio="xMidYMid meet" class="se-svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--se-arrow,#4b5563);"/>
    </marker>
  </defs>
  <text x="600" y="32" text-anchor="middle" style="font-size:20px;font-weight:700;fill:var(--se-text,#111111);">The Blast Radius Test</text>
  <text x="600" y="54" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">A single rule decides what enters the knowledge graph and what stays local.</text>

  <rect x="460" y="90" width="280" height="64" rx="12" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-box-stroke,#4b5563);stroke-width:1.5;"/>
  <text x="600" y="128" text-anchor="middle" style="font-size:14px;font-weight:600;fill:var(--se-text,#111111);">Any candidate element</text>

  <path d="M600,154 L600,200" marker-end="url(#ar)" style="stroke:var(--se-arrow,#4b5563);stroke-width:1.8;fill:none;"/>

  <polygon points="600,210 800,330 600,450 400,330" style="fill:var(--se-panel-fill,#f5f5f5);stroke:var(--se-box-stroke,#4b5563);stroke-width:1.5;"/>
  <text x="600" y="305" text-anchor="middle" style="font-size:14px;font-weight:600;fill:var(--se-text,#111111);">Does its change</text>
  <text x="600" y="325" text-anchor="middle" style="font-size:14px;font-weight:600;fill:var(--se-text,#111111);">cascade beyond</text>
  <text x="600" y="345" text-anchor="middle" style="font-size:14px;font-weight:600;fill:var(--se-text,#111111);">local context?</text>

  <text x="320" y="395" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--se-accent,#E94E1B);">YES</text>
  <text x="880" y="395" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--se-text-secondary,#4b5563);">NO</text>

  <path d="M450,380 L320,440 L320,470" marker-end="url(#ar)" style="stroke:var(--se-arrow,#4b5563);stroke-width:1.8;fill:none;"/>
  <path d="M750,380 L880,440 L880,470" marker-end="url(#ar)" style="stroke:var(--se-arrow,#4b5563);stroke-width:1.8;fill:none;"/>

  <rect x="120" y="470" width="400" height="80" rx="12" style="fill:var(--se-accent-fill,#FDE8DD);stroke:var(--se-accent,#E94E1B);stroke-width:2;"/>
  <text x="320" y="500" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--se-text,#111111);">Enters the knowledge graph</text>
  <text x="320" y="522" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Governed by graph</text>
  <text x="320" y="540" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Changes require deliberate decision</text>

  <rect x="680" y="470" width="400" height="80" rx="12" style="fill:var(--se-box-fill,#ffffff);stroke:var(--se-box-stroke,#4b5563);stroke-width:1.5;"/>
  <text x="880" y="500" text-anchor="middle" style="font-size:14px;font-weight:700;fill:var(--se-text,#111111);">Stays in code, config, or local context</text>
  <text x="880" y="522" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">Local autonomy applies</text>
  <text x="880" y="540" text-anchor="middle" style="font-size:12px;fill:var(--se-text-secondary,#4b5563);">No graph-level coordination needed</text>
</svg>
