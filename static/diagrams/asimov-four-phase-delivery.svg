<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" preserveAspectRatio="xMidYMid meet" font-family="Segoe UI, system-ui, sans-serif" class="se-svg">
  <style>
.phase { fill:var(--se-accent-fill,#FDE8DD); stroke:var(--se-accent,#E94E1B); stroke-width:2; }
    .phaseLast { fill:var(--se-accent-fill,#FDE8DD); stroke:var(--se-accent,#E94E1B); stroke-width:2; }
    .detail { fill:var(--se-box-fill,#ffffff); stroke:var(--se-text-secondary,#4b5563); stroke-width:1.2; }
    .h1 { font-size:22px; font-weight:700; fill:var(--se-text,#111111); }
    .sub { font-size:12px; fill:var(--se-text-secondary,#4b5563); }
    .phaseTitle { font-size:15px; font-weight:700; fill:var(--se-text,#111111); }
    .phaseSub { font-size:11px; fill:var(--se-text,#111111); }
    .bullet { font-size:11px; fill:var(--se-text,#111111); }
    .ileg { font-size:11px; font-weight:700; fill:var(--se-accent,#E94E1B); }
  </style>
<text x="700" y="38" text-anchor="middle" class="h1">ASIMOV Five-Phase Delivery</text>
  <text x="700" y="60" text-anchor="middle" class="sub">Discovery and analysis · graph generation · MVP migration · scaled migration · UAT and deployment</text>

  <!-- 5 phase chevrons -->
  <g transform="translate(40,100)">
    <!-- Phase 1 -->
    <polygon class="phase" points="0,0 220,0 250,40 220,80 0,80 30,40"/>
    <text x="125" y="35" text-anchor="middle" class="phaseTitle">Discovery</text>
    <text x="125" y="56" text-anchor="middle" class="phaseTitle">&amp; Analysis</text>
  </g>
  <g transform="translate(308,100)">
    <polygon class="phase" points="0,0 220,0 250,40 220,80 0,80 30,40"/>
    <text x="125" y="32" text-anchor="middle" class="phaseTitle">Code Graph</text>
    <text x="125" y="50" text-anchor="middle" class="phaseTitle">Generation</text>
    <text x="125" y="68" text-anchor="middle" class="phaseTitle">&amp; Enrichment</text>
  </g>
  <g transform="translate(576,100)">
    <polygon class="phase" points="0,0 220,0 250,40 220,80 0,80 30,40"/>
    <text x="125" y="32" text-anchor="middle" class="phaseTitle">MVP · One Module</text>
    <text x="125" y="52" text-anchor="middle" class="phaseSub">Iterative Migration</text>
  </g>
  <g transform="translate(844,100)">
    <polygon class="phase" points="0,0 220,0 250,40 220,80 0,80 30,40"/>
    <text x="125" y="32" text-anchor="middle" class="phaseTitle">Scaled Migration</text>
    <text x="125" y="52" text-anchor="middle" class="phaseSub">Iterative Migration</text>
  </g>
  <g transform="translate(1112,100)">
    <polygon class="phase" points="0,0 220,0 250,40 220,80 0,80 30,40"/>
    <text x="125" y="35" text-anchor="middle" class="phaseTitle">UAT &amp;</text>
    <text x="125" y="56" text-anchor="middle" class="phaseTitle">Deployment</text>
  </g>

  <!-- Detail panels -->
  <!-- Phase 1 details -->
  <rect class="detail" x="40" y="220" width="250" height="340" rx="8"/>
  <text x="56" y="245" class="bullet">• AI-driven deep analysis of</text>
  <text x="56" y="262" class="bullet">  source code &amp; supporting</text>
  <text x="56" y="279" class="bullet">  artifacts</text>
  <text x="56" y="306" class="bullet">• Comprehensive Analysis</text>
  <text x="56" y="323" class="bullet">  Report &amp; migration</text>
  <text x="56" y="340" class="bullet">  recommendations</text>
  <text x="56" y="367" class="bullet">• Detailed migration plan</text>
  <text x="56" y="384" class="bullet">  with target architecture</text>
  <text x="56" y="401" class="bullet">  and designs</text>
  <text x="56" y="428" class="bullet">• MVP module identification</text>

  <!-- Phase 2 details -->
  <rect class="detail" x="308" y="220" width="250" height="340" rx="8"/>
  <text x="324" y="245" class="bullet">• Knowledge graph creation</text>
  <text x="324" y="262" class="bullet">  with automated ingestion</text>
  <text x="324" y="279" class="bullet">  of source code, target</text>
  <text x="324" y="296" class="bullet">  architecture, and designs</text>
  <text x="324" y="313" class="bullet">  into graph database</text>
  <text x="324" y="340" class="bullet">• AI-driven enrichment of</text>
  <text x="324" y="357" class="bullet">  the knowledge graph</text>

  <!-- Phase 3 details -->
  <rect class="detail" x="576" y="220" width="250" height="340" rx="8"/>
  <text x="592" y="245" class="bullet">• Customization &amp;</text>
  <text x="592" y="262" class="bullet">  configuration of AI agents</text>
  <text x="592" y="279" class="bullet">  (frontend, backend, services)</text>
  <text x="592" y="306" class="bullet">• Agent-driven migration of</text>
  <text x="592" y="323" class="bullet">  MVP module code</text>
  <text x="592" y="350" class="bullet">• Technical &amp; Functional</text>
  <text x="592" y="367" class="bullet">  SME feedback</text>
  <text x="592" y="394" class="bullet">• Tune AI agents for</text>
  <text x="592" y="411" class="bullet">  iterative improvement</text>
  <text x="592" y="428" class="bullet">  based on feedback</text>
  <text x="592" y="455" class="ileg">↻ Iterates until gates pass</text>

  <!-- Phase 4 details -->
  <rect class="detail" x="844" y="220" width="250" height="340" rx="8"/>
  <text x="860" y="245" class="bullet">• Agent-driven migration of</text>
  <text x="860" y="262" class="bullet">  remaining modules</text>
  <text x="860" y="289" class="bullet">• Deployment and testing</text>
  <text x="860" y="306" class="bullet">  of migrated app code</text>
  <text x="860" y="333" class="bullet">• Technical &amp; Functional</text>
  <text x="860" y="350" class="bullet">  SME feedback</text>
  <text x="860" y="377" class="bullet">• Tune AI agents for</text>
  <text x="860" y="394" class="bullet">  iterative improvement</text>
  <text x="860" y="411" class="bullet">  across wider estate</text>
  <text x="860" y="438" class="ileg">↻ Iterates per module</text>

  <!-- Phase 5 details -->
  <rect class="detail" x="1112" y="220" width="250" height="340" rx="8"/>
  <text x="1128" y="245" class="bullet">• Deployment and UAT</text>
  <text x="1128" y="262" class="bullet">  testing of migrated app</text>
  <text x="1128" y="289" class="bullet">• Technical &amp; Functional</text>
  <text x="1128" y="306" class="bullet">  SME feedback</text>
  <text x="1128" y="333" class="bullet">• UAT fixes based on</text>
  <text x="1128" y="350" class="bullet">  feedback</text>
  <text x="1128" y="377" class="bullet">• Generation of technical</text>
  <text x="1128" y="394" class="bullet">  documentation for the</text>
  <text x="1128" y="411" class="bullet">  migrated application code</text>

  <text x="700" y="595" text-anchor="middle" class="sub" font-style="italic">SME tuning loop runs throughout MVP and Scaled phases. AVF gates enforce quality continuously, not at the end.</text>
</svg>
