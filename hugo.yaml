title: Semantic Engineering
baseURL: https://semantic-engineering.ai/
languageCode: en-us

enableInlineShortcodes: true
enableGitInfo: false
enableRobotsTXT: true

# Google Analytics (GA4). Loaded only in production builds, not local serve.
services:
  googleAnalytics:
    ID: G-9F9DMLMBBN

# Custom plain-text output for /llms.txt (a curated index for AI/LLM crawlers).
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - llms

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Hextra has Mermaid support built in; this makes it explicit.
params:
  # og:site_name + default social share image (1200x630).
  title: Semantic Engineering
  images:
    - og-image.png
  theme:
    default: system
    displayToggle: true
  editURL:
    enable: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 34
      height: 24
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  page:
    width: wide
  toc:
    enable: true
  # Click any diagram/image to open a zoomable popup (medium-zoom).
  imageZoom:
    enable: true

# Top navigation: page links removed — navigation lives in the left sidebar
# (which doubles as the mobile hamburger menu). Keep only search here.
menu:
  main:
    - name: Search
      weight: 1
      params:
        type: search
